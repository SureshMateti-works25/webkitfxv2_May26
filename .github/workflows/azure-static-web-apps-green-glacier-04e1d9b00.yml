# Portal-generated SWA workflow (green-glacier-…). Monorepo: ./apps is not a single app — Oryx cannot build it.
# This job builds the demo Vite app and uploads dist. To host groceries/sarees instead, copy env + script from
# azure-swa-groceries.yml / azure-swa-sarees.yml and set app_location to apps/<app>/dist.
name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - develop
    paths:
      - "apps/demo/**"
      - "packages/core-engine/**"
      - "packages/react-renderer/**"
      - "package-lock.json"
      - ".github/workflows/azure-static-web-apps-green-glacier-04e1d9b00.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages + demo
        run: npm run build:demo

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_GLACIER_04E1D9B00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/demo/dist
          api_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_GLACIER_04E1D9B00 }}
          action: close
