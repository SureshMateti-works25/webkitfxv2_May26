# Local PostgreSQL for Commerce.Api (see Commerce.Api/README.md).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      # 55432 is often blocked on Windows (hypervisor / excluded range); 54330 avoids that.
      - "54330:5432"
    volumes:
      - catalog_pg_data:/var/lib/postgresql/data

volumes:
  catalog_pg_data:
