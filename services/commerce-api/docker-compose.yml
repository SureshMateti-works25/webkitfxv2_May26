# Local PostgreSQL for Commerce.Api (see Commerce.Api/README.md).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      # Use 54332 on Windows if 54330 is in an excluded port range (Hyper-V / WSL).
      - "25432:5432"
    volumes:
      - catalog_pg_data:/var/lib/postgresql/data

volumes:
  catalog_pg_data:
